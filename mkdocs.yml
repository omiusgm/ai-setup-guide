site_name: "Как заставить ИИ работать за тебя"
site_description: "Бесплатный гайд по ИИ — от новичка до продвинутого. Апрель 2026."
site_url: https://omiusgm.github.io/ai-setup-guide/
repo_url: https://github.com/omiusgm/ai-setup-guide
repo_name: omiusgm/ai-setup-guide

docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: ru
  - tags:
      tags_file: tags.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/landing.css

extra_javascript:
  - javascripts/catalog-filter.js

nav:
  - "": index.md
  - "Новичкам":
    - "Быстрый старт": getting-started.md
    - "4 уровня ИИ": guides/levels.md
    - "10 правил": guides/rules.md
    - "Мифы про ИИ": guides/myths.md
    - "Бюджет от 0 до $200": guides/budget.md
    - "Россия: VPN и оплата": guides/russia.md
  - "Скиллы и репозитории":
    - "Caveman — краткость": skills/caveman.md
    - "GSD — оркестрация": skills/gsd.md
    - "Humanizer — живой текст": skills/humanizer.md
    - "Honcho — память": skills/honcho.md
    - "Remotion — видео": skills/remotion.md
    - "Поиск": skills/search.md
  - "MCP-подключения":
    - "Что такое MCP": mcp/overview.md
    - "Firecrawl — скрапинг": mcp/firecrawl.md
    - "Composio — 1000+ интеграций": mcp/composio.md
    - "Docker MCP — 300+ плагинов": mcp/docker-mcp.md
    - "n8n-MCP": mcp/n8n-mcp.md
    - "Агент-в-агенте": mcp/claude-code-mcp.md
  - "Мультиагенты":
    - "3 уровня": agents/overview.md
    - "Managed Agents": agents/managed-agents.md
    - "Agent Teams": agents/agent-teams.md
    - "Альтернативы": agents/alternatives.md
    - "AutoResearch": agents/autoresearch.md
  - "Автоматизация":
    - "n8n без кода": automation/n8n.md
    - "/loop и Remote Tasks": automation/loop.md
    - "AmoCRM + ИИ": crm/amocrm.md
  - "Практика":
    - "3 режима Claude": guides/modes.md
    - "Память и контекст": guides/memory.md
    - "Экономия токенов": skills/caveman.md
  - "Для ИИ":
    - "Для чатботов": for-chatbots.md
    - "Для агентов": for-agents.md

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/agentezh
      name: Telegram-канал Агент Ёж
  generator: false

copyright: "Контент сгенерирован ИИ | <a href='https://t.me/agentezh'>Telegram «Агент Ёж»</a>"
